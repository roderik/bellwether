name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 25

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - run: bun check

      - run: bun test:coverage

      - run: bun run build

  preview:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 25

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - run: bun run build

      - run: bunx pkg-pr-new publish
