name: Publish

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 25

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - run: bun check

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm pkg set version="$VERSION"
          # Update plugin manifest and marketplace versions
          jq --arg v "$VERSION" '.version = $v' .claude-plugin/plugin.json > .claude-plugin/plugin.tmp && mv .claude-plugin/plugin.tmp .claude-plugin/plugin.json
          jq --arg v "$VERSION" '.plugins.bellwether.version = $v' marketplace.json > marketplace.tmp && mv marketplace.tmp marketplace.json

      - run: bunx zile publish:prepare

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create release assets PR
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/release-assets/${{ github.ref_name }}
          base: main
          commit-message: "chore(release): sync version to ${{ github.ref_name }} [skip ci]"
          committer: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          add-paths: |
            package.json
            .claude-plugin/plugin.json
            marketplace.json
          title: "chore(release): sync version to ${{ github.ref_name }}"
          body: |
            Automated version sync for `${{ github.ref_name }}`.
            Generated by the Publish workflow.
