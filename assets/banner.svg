<svg width="1280" height="400" viewBox="0 0 1280 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1280" height="400" fill="#0d1117"/>
  <rect width="1280" height="400" fill="url(#bg_grad)"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="80" x2="1280" y2="80" stroke="#161b22" stroke-width="1"/>
  <line x1="0" y1="160" x2="1280" y2="160" stroke="#161b22" stroke-width="1"/>
  <line x1="0" y1="240" x2="1280" y2="240" stroke="#161b22" stroke-width="1"/>
  <line x1="0" y1="320" x2="1280" y2="320" stroke="#161b22" stroke-width="1"/>
  <line x1="256" y1="0" x2="256" y2="400" stroke="#161b22" stroke-width="1"/>
  <line x1="512" y1="0" x2="512" y2="400" stroke="#161b22" stroke-width="1"/>
  <line x1="768" y1="0" x2="768" y2="400" stroke="#161b22" stroke-width="1"/>
  <line x1="1024" y1="0" x2="1024" y2="400" stroke="#161b22" stroke-width="1"/>

  <!-- Green glow behind logo -->
  <circle cx="192" cy="200" r="100" fill="#3fb950" fill-opacity="0.06"/>

  <!-- Logo (mini version, centered at 192,200) -->
  <g transform="translate(132, 130) scale(0.55)">
    <rect width="220" height="220" rx="44" fill="#161b22"/>
    <!-- Bell cap -->
    <ellipse cx="110" cy="40" rx="14" ry="7" fill="#3fb950"/>
    <!-- Bell body -->
    <path d="M96 47 C74 57 62 78 62 102 L62 122 L50 132 L50 139 L170 139 L170 132 L158 122 L158 102 C158 78 146 57 124 47 Z" fill="#3fb950"/>
    <!-- Bell clapper mount -->
    <rect x="100" y="139" width="20" height="8" rx="4" fill="#3fb950"/>
    <!-- Bell clapper ball -->
    <circle cx="110" cy="156" r="10" fill="#3fb950"/>
    <!-- Checkmark -->
    <path d="M82 92 L96 108 L138 75" stroke="#0d1117" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Product name -->
  <text x="340" y="180" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', monospace" font-size="80" font-weight="700" fill="#e6edf3" letter-spacing="-2">bellwether</text>

  <!-- Tagline -->
  <text x="342" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" fill="#8b949e" letter-spacing="0.2">Drive PRs to merge-ready. Automatically.</text>

  <!-- Divider -->
  <line x1="340" y1="262" x2="920" y2="262" stroke="#30363d" stroke-width="1"/>

  <!-- Feature pills -->
  <!-- CI Watch -->
  <rect x="340" y="280" width="148" height="38" rx="19" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <circle cx="365" cy="299" r="6" fill="#3fb950"/>
  <text x="381" y="304" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" fill="#8b949e">CI Watch</text>

  <!-- Fix Failures -->
  <rect x="504" y="280" width="168" height="38" rx="19" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <circle cx="529" cy="299" r="6" fill="#3fb950"/>
  <text x="545" y="304" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" fill="#8b949e">Fix Failures</text>

  <!-- Review Loop -->
  <rect x="688" y="280" width="168" height="38" rx="19" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <circle cx="713" cy="299" r="6" fill="#3fb950"/>
  <text x="729" y="304" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" fill="#8b949e">Review Loop</text>

  <!-- Terminal window on right -->
  <g transform="translate(960, 72)">
    <!-- Window frame -->
    <rect width="264" height="256" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <!-- Title bar -->
    <rect width="264" height="36" rx="10" fill="#21262d"/>
    <rect x="0" y="18" width="264" height="18" fill="#21262d"/>
    <!-- Traffic lights -->
    <circle cx="18" cy="18" r="6" fill="#ff5f57"/>
    <circle cx="38" cy="18" r="6" fill="#febc2e"/>
    <circle cx="58" cy="18" r="6" fill="#28c840"/>
    <!-- Terminal text -->
    <text x="16" y="68" font-family="'SF Mono', 'Fira Code', monospace" font-size="12" fill="#8b949e">$ npx bellwether check --watch</text>
    <text x="16" y="92" font-family="'SF Mono', 'Fira Code', monospace" font-size="12" fill="#c9d1d9">pr:</text>
    <text x="16" y="110" font-family="'SF Mono', 'Fira Code', monospace" font-size="12" fill="#c9d1d9">  state: <tspan fill="#3fb950">open</tspan></text>
    <text x="16" y="128" font-family="'SF Mono', 'Fira Code', monospace" font-size="12" fill="#c9d1d9">  mergeable: <tspan fill="#3fb950">clean</tspan></text>
    <text x="16" y="146" font-family="'SF Mono', 'Fira Code', monospace" font-size="12" fill="#c9d1d9">  ready: <tspan fill="#3fb950">true</tspan></text>
    <text x="16" y="172" font-family="'SF Mono', 'Fira Code', monospace" font-size="12" fill="#c9d1d9">ci:</text>
    <text x="16" y="190" font-family="'SF Mono', 'Fira Code', monospace" font-size="12" fill="#c9d1d9">  sha: <tspan fill="#8b949e">abc1234</tspan></text>
    <text x="16" y="208" font-family="'SF Mono', 'Fira Code', monospace" font-size="12" fill="#c9d1d9">  checks: <tspan fill="#3fb950">3/3 passing</tspan></text>
    <text x="16" y="232" font-family="'SF Mono', 'Fira Code', monospace" font-size="12" fill="#c9d1d9">reviews:</text>
    <text x="16" y="250" font-family="'SF Mono', 'Fira Code', monospace" font-size="12" fill="#c9d1d9">  total: <tspan fill="#3fb950">0 unresolved</tspan></text>
  </g>

  <defs>
    <linearGradient id="bg_grad" x1="0" y1="0" x2="1280" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#161b22" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>
